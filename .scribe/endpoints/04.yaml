      - POST
    uri: api/depreciation-tables
    metadata:
      custom: []
      groupName: Endpoints
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Calcule la valeur théorique du marché et la dépréciation.'
      description: |-
        Paramètres requis pour le calcul :
        - usage_id : L'usage du véhicule (nécessaire pour trouver la table de dépréciation)
        - energy_id : La source d'énergie du véhicule (essence/diesel) pour calculer l'incidence kilométrique
        - vehicle_new_value : La valeur neuve du véhicule
        - vehicle_mileage : Le kilométrage actuel du véhicule
        - first_entry_into_circulation_date : Date de première mise en circulation (pour calculer l'âge)
        - expertise_date : Date d'expertise (pour calculer l'âge)
        - market_incidence_rate : Taux d'incidence de marché (optionnel, 0-100)

        Pour trouver la table de dépréciation, on utilise :
        - L'usage (usage_id)
        - L'âge du véhicule (calculé à partir des dates first_entry_into_circulation_date et expertise_date)
        - La source d'énergie (energy_id) est utilisée pour le calcul de l'incidence kilométrique
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      usage_id:
        custom: []
        name: usage_id
        description: ''
        required: true
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      energy_id:
        custom: []
        name: energy_id
        description: ''
        required: true
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      vehicle_new_value:
        custom: []
        name: vehicle_new_value
        description: 'Must be at least 0.'
        required: true
        example: 39
        type: number
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      vehicle_mileage:
        custom: []
        name: vehicle_mileage
        description: 'Must be at least 0.'
        required: true
        example: 84
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      first_entry_into_circulation_date:
        custom: []
        name: first_entry_into_circulation_date
        description: 'Must be a valid date. Must be a date before or equal to <code>expertise_date</code>.'
        required: true
        example: '2022-01-03'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      expertise_date:
        custom: []
        name: expertise_date
        description: 'Must be a valid date. Must be a date after or equal to <code>first_entry_into_circulation_date</code>.'
        required: true
        example: '2052-01-03'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      market_incidence_rate:
        custom: []
        name: market_incidence_rate
        description: 'Must be at least 0. Must not be greater than 100.'
        required: false
        example: 22
        type: number
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
    cleanBodyParameters:
      usage_id: architecto
