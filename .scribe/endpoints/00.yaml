    uri: api/auth/logout
    metadata:
      custom: []
      groupName: Authentification
      groupDescription: |-

        Gestion de l'authentification des utilisateurs via API.
      subgroup: ''
      subgroupDescription: ''
      title: Déconnexion
      description: "Déconnecte l'utilisateur authentifié et révoque le token d'accès actuel."
      authenticated: true
      deprecated: false
    headers:
