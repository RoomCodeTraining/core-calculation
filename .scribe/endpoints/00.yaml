name: Authentification
description: |-

  Gestion de l'authentification des utilisateurs via API.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/auth/login
    metadata:
      custom: []
      groupName: Authentification
      groupDescription: |-

        Gestion de l'authentification des utilisateurs via API.
      subgroup: ''
      subgroupDescription: ''
      title: Authentification
      description: 'Authentifie un utilisateur avec son email et mot de passe, et retourne un token Bearer pour les requêtes suivantes.'
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: "L'adresse email de l'utilisateur."
        required: true
        example: user@example.com
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: "Le mot de passe de l'utilisateur."
        required: true
        example: password123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: user@example.com
      password: password123
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "status": 200,
            "message": "Authentification réussie",
            "data": {
              "user": {
                "id": "abc123",
                "name": "John Doe",
                "email": "user@example.com",
                "role": "user",
                "organization": {
                  "id": "org123",
                  "name": "Mon Organisation",
                  "slug": "mon-organisation",
                  "api_quota": 1000
                }
              },
              "token": "1|abcdefghijklmnopqrstuvwxyz1234567890",
              "token_type": "Bearer"
            }
          }
        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: |-
          {
            "errors": [
              {
                "status": 401,
                "title": "Authentification échouée",
                "detail": "Les identifiants fournis sont incorrects."
              }
            ]
          }
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
